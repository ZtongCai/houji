# 后稷 tomato-01 实例；systemd EnvironmentFile 格式，不含密钥。
HOUJI_INSTANCE_ID=tomato-01
HOUJI_DATA_DIR=/home/houjiagent/houji/brain/data
CROP_PROFILE=tomato_fruit_ab
GROWTH_STAGE=seedling
PLANTING_BATCH=TOMATO-2026-08-12-A
PLANTING_START_DATE=2026-08-12

# 默认观察模式：采集、拍照、AI 分析、网页展示；执行层不连接 Pico。
RUN_MODE=control
AI_ENABLED=true
CAMERA_ENABLED=true
CAMERA_FLASH_ENABLED=true
NUTRIENT_DOSING_ENABLED=true

AIR_SENSOR_PORT=/dev/ttyAMA0
AIR_SENSOR_BAUD=9600
PICO_SERIAL_PORT=/dev/serial/by-id/usb-MicroPython_Board_in_FS_mode_e99114e1a06febe0-if00
PICO_SERIAL_BAUD=115200
CAMERA_INDEX=0
TDS_COMPENSATION_TEMPERATURE_C=25.0

SENSOR_INTERVAL=10
SNAPSHOT_INTERVAL=1800
AI_DECISION_INTERVAL=1800
